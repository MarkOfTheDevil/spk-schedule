name: Verify Pulse 2.0 preview (no deployment)
on:
  push:
    branches: [develop/pulse-2.0]
  pull_request:
    paths: ['pulse/**', 'tools/build*pwa.py', 'tools/build_pulse.py', 'tests/pulse*', 'package.json', '.github/workflows/pulse-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_pulse.py
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - run: python -m unittest discover -s tests -p test_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-2.0-preview
          path: _site/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-browser-screenshots
          path: test-results/
